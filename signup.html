<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Create an Account — TuneVis</title>
  <meta name="theme-color" content="#121212">
  <meta name="robots" content="noindex">
  <meta name="description" content="Explore a song's audio features, find similar tracks and rank your favourite artists, albums and songs.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="TuneVis">
  <meta property="og:title" content="TuneVis — Interactive Music Recommender">
  <meta property="og:description" content="Explore a song's audio features, find similar tracks and rank your favourite artists, albums and songs.">
  <meta property="og:image" content="https://tunevis.vercel.app/icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="TuneVis logo with audio bars">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://tunevis.vercel.app/icons/og-image.png">
  <link rel="icon" href="/icons/icon-512.png?v=5" sizes="512x512" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=5" sizes="180x180" type="image/png">
  <link rel="manifest" href="/manifest.webmanifest?v=5">
  <meta name="apple-mobile-web-app-title" content="TuneVis">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/style.css">
</head>
<body class="page-flex" data-auth-page="signup">
  <div class="bg-layer">
    <div class="bg-circle c1"></div>
    <div class="bg-circle c2"></div>
    <div class="bg-circle c3"></div>
    <div class="bg-circle c4"></div>
  </div>

  <header class="features-header">
    <button id="back-btn" aria-label="Back">&#8592;</button>

    <a href="home.html" class="header-logo-link" title="TuneVis home">
      <div class="header-logo-inner">
        <svg class="header-logo-bars" viewBox="0 0 80 34" preserveAspectRatio="xMidYMid meet">
          <defs>
          <linearGradient id="tv-bars" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#139a45"/>
            <stop offset="1" stop-color="#3ff08a"/>
          </linearGradient>
        </defs>
        <g class="audio-bars">
            <rect x="4"  y="13" width="5" height="8"  rx="2.5"/>
            <rect x="15" y="5"  width="5" height="24" rx="2.5"/>
            <rect x="26" y="8"  width="5" height="18" rx="2.5"/>
            <rect x="37" y="2"  width="5" height="30" rx="2.5"/>
            <rect x="48" y="8"  width="5" height="18" rx="2.5"/>
            <rect x="59" y="5"  width="5" height="24" rx="2.5"/>
            <rect x="70" y="13" width="5" height="8"  rx="2.5"/>
          </g>
        </svg>
        <span class="header-logo-text">TuneVis</span>
      </div>
    </a>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <h1 class="auth-title">Create a TuneVis account</h1>
      <p class="auth-intro">Save your rankings and keep your recently viewed tracks on every device.</p>
      <p class="auth-notice" id="auth-notice" hidden></p>
      <form class="auth-form" id="auth-form" novalidate>
        <label class="auth-field">
          <span>Email</span>
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label class="auth-field">
          <span>Password (at least 8 characters)</span>
          <input type="password" name="password" autocomplete="new-password" minlength="8" required>
        </label>
        <label class="auth-field">
          <span>Confirm password</span>
          <input type="password" name="confirm" autocomplete="new-password" minlength="8" required>
        </label>
        <button type="submit">Create account</button>
      </form>
      <p class="auth-links">
        <a href="login.html" id="login-link">Already have an account? Sign in</a>
      </p>
    </div>
  </main>

  <footer class="site-footer">
    <nav class="footer-links" aria-label="Site">
      <a href="about.html">About</a>
      <a href="faq.html">Help &amp; FAQ</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </nav>
    <p class="footer-credit">Built with the Spotify Web API, ReccoBeats &amp; Last.fm &middot; &copy; 2026 TuneVis</p>
    <p class="footer-note">TuneVis isn't affiliated with or endorsed by Spotify.</p>
  </footer>

  <script type="module" src="scripts/auth-pages.js"></script>
</body>
</html>
