<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TuneVis</title>
  <meta name="theme-color" content="#121212">
  <meta name="description" content="Explore a song's audio features, find similar tracks and rank your favourite artists, albums and songs.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="TuneVis">
  <meta property="og:title" content="TuneVis — Interactive Music Recommender">
  <meta property="og:description" content="Explore a song's audio features, find similar tracks and rank your favourite artists, albums and songs.">
  <meta property="og:image" content="https://tunevis.vercel.app/icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="TuneVis logo with audio bars">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://tunevis.vercel.app/icons/og-image.png">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="TuneVis">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/style.css">
  <script src="libs/d3.v7.min.js"></script>
  <script src="libs/popper.v2.min.js"></script>
  <script src="libs/tippy.v6.min.js"></script>
</head>
<body>
  <div class="bg-layer">
    <div class="bg-circle c1"></div>
    <div class="bg-circle c2"></div>
    <div class="bg-circle c3"></div>
    <div class="bg-circle c4"></div>
  </div>

  <header class="features-header">
    <button id="back-btn" aria-label="Back">&#8592;</button>

    <a href="home.html" class="header-logo-link" title="TuneVis home">
      <div class="header-logo-inner">
        <svg class="header-logo-bars" viewBox="0 0 80 34" preserveAspectRatio="xMidYMid meet">
          <defs>
          <linearGradient id="tv-bars" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#139a45"/>
            <stop offset="1" stop-color="#3ff08a"/>
          </linearGradient>
        </defs>
        <g class="audio-bars">
            <rect x="4"  y="13" width="5" height="8"  rx="2.5"/>
            <rect x="15" y="5"  width="5" height="24" rx="2.5"/>
            <rect x="26" y="8"  width="5" height="18" rx="2.5"/>
            <rect x="37" y="2"  width="5" height="30" rx="2.5"/>
            <rect x="48" y="8"  width="5" height="18" rx="2.5"/>
            <rect x="59" y="5"  width="5" height="24" rx="2.5"/>
            <rect x="70" y="13" width="5" height="8"  rx="2.5"/>
          </g>
        </svg>
        <span class="header-logo-text">TuneVis</span>
      </div>
    </a>

    <button id="audio-help-btn" aria-label="Audio features guide">?</button>
  </header>

  <div id="track-info"></div>

  <div class="grid-3">

    <section id="card-radar" class="card">
      <div class="card-head">
        <div class="card-title">
          <h3>Radar Comparison</h3>
        </div>
      </div>
      <div id="sim-radar"></div>
    </section>

    <section id="card-bar" class="card">
      <div class="card-head">
        <div class="card-title">
          <h3 style="margin:0;">Similarity Score</h3>
          <button id="sim-help" class="help-btn" type="button" aria-label="How similarity is calculated">?</button>
        </div>
      </div>
      <div id="sim-bar"></div>
    </section>

    <section id="card-scatter" class="card">
      <div class="card-head">
        <div class="card-title">
          <h3>Scatter Comparison</h3>
        </div>
        <div class="contols">
          <label>X:
            <select id="x-feature">
              <option value="energy">Energy</option>
              <option value="danceability">Danceability</option>
              <option value="valence">Valence</option>
              <option value="acousticness">Acousticness</option>
              <option value="speechiness">Speechiness</option>
              <option value="instrumentalness">Instrumentalness</option>
              <option value="tempo">Tempo</option>
            </select>
          </label>
          <label>Y:
            <select id="y-feature">
              <option value="valence">Valence</option>
              <option value="energy">Energy</option>
              <option value="danceability">Danceability</option>
              <option value="acousticness">Acousticness</option>
              <option value="speechiness">Speechiness</option>
              <option value="instrumentalness">Instrumentalness</option>
              <option value="tempo">Tempo</option>
            </select>
          </label>
        </div>
      </div>
      <div id="sim-scatter"></div>
      <p class="chart-hint">Tip: Click a dot to open that track's audio features</p>
    </section>

    <section id="card-message" class="card centered-message" style="display:none;">
      <div id="no-features"></div>
    </section>

    <section id="recs-card" class="card span-3">
      <div id="recommendations"></div>
    </section>

  </div>

  <div id="page-loading" class="loading-overlay" style="display:none;">
    <div class="loading-card">
      <div class="spinner"></div>
      <div class="loading-title">Loading analysis...</div>
      <div id="loading-sub" class="loading-sub">Fetching audio features</div>
    </div>
  </div>

  <footer>
    <p>TuneVis | Built using Spotify API, ReccoBeats &amp; Last.fm API</p>
  </footer>

  <div id="chart-tooltip" class="chart-tooltip" style="display:none;"></div>

  <script type="module" src="scripts/features.js"></script>
  <script type="module" src="scripts/features-data.js"></script>
  <script type="module" src="scripts/features-charts.js"></script>
  <script type="module" src="scripts/account-nav.js"></script>
</body>
</html>
