<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Album &amp; Artist Rankings — TuneVis</title>
  <meta name="theme-color" content="#121212">
  <link rel="canonical" href="https://tunevis.vercel.app/rank.html">
  <meta property="og:url" content="https://tunevis.vercel.app/rank.html">
  <meta name="description" content="Rank an album's tracks or an artist's top tracks and albums, rate albums out of five stars, and export your list as an image.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="TuneVis">
  <meta property="og:title" content="Album &amp; Artist Rankings — TuneVis">
  <meta property="og:description" content="Rank an album's tracks or an artist's top tracks and albums, rate albums out of five stars, and export your list as an image.">
  <meta property="og:image" content="https://tunevis.vercel.app/icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="TuneVis logo with audio bars">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://tunevis.vercel.app/icons/og-image.png">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="TuneVis">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/style.css">
</head>
<body class="page-flex">
  <div class="bg-layer">
    <div class="bg-circle c1"></div>
    <div class="bg-circle c2"></div>
    <div class="bg-circle c3"></div>
    <div class="bg-circle c4"></div>
  </div>

  <header class="features-header">
    <button id="back-btn" aria-label="Back">&#8592;</button>

    <a href="home.html" class="header-logo-link" title="TuneVis home">
      <div class="header-logo-inner">
        <svg class="header-logo-bars" viewBox="0 0 80 34" preserveAspectRatio="xMidYMid meet">
          <defs>
          <linearGradient id="tv-bars" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#139a45"/>
            <stop offset="1" stop-color="#3ff08a"/>
          </linearGradient>
        </defs>
        <g class="audio-bars">
            <rect x="4"  y="13" width="5" height="8"  rx="2.5"/>
            <rect x="15" y="5"  width="5" height="24" rx="2.5"/>
            <rect x="26" y="8"  width="5" height="18" rx="2.5"/>
            <rect x="37" y="2"  width="5" height="30" rx="2.5"/>
            <rect x="48" y="8"  width="5" height="18" rx="2.5"/>
            <rect x="59" y="5"  width="5" height="24" rx="2.5"/>
            <rect x="70" y="13" width="5" height="8"  rx="2.5"/>
          </g>
        </svg>
        <span class="header-logo-text">TuneVis</span>
      </div>
    </a>
  </header>

  <div id="rank-page-loading" class="loading-overlay">
    <div class="loading-card">
      <div class="spinner"></div>
      <div class="loading-title">Loading tracklist...</div>
      <div class="loading-sub">Fetching from Spotify</div>
    </div>
  </div>

  <div id="rank-page" style="display:none;">
    <div class="rank-head" id="rank-head"></div>

    <div class="rank-player-wrap" id="rank-player-wrap" style="display:none;"></div>

    <!-- A saved ranking opens as a finished list; Edit switches to the workspace below. -->
    <section class="rank-view" id="rank-view" hidden>
      <h2 class="rank-view-title" id="rank-view-title"></h2>
      <p class="rank-view-meta" id="rank-view-meta"></p>
      <ol class="rank-view-list" id="rank-view-list"></ol>
      <div class="rank-view-actions">
        <button id="rank-edit-btn" type="button">Edit ranking</button>
        <button id="rank-view-export-btn" type="button" class="secondary-btn">Export</button>
      </div>
    </section>

    <div id="rank-edit">
    <div class="list-name-row">
      <label for="list-name-input" class="sr-only-label">List name</label>
      <input type="text" id="list-name-input" class="list-name-input" placeholder="Name your ranking..." />
      <button id="export-btn" type="button">Export</button>
      <button id="save-rank-btn" type="button" class="save-rank-btn" hidden>Save</button>
      <button id="rank-done-btn" type="button" class="secondary-btn" hidden>Done</button>
    </div>

    <div class="rank-mode-toggle" id="rank-list-toggle" role="group" aria-label="What to rank" hidden>
      <button class="tab-btn active" type="button" data-list="tracks">Top tracks</button>
      <button class="tab-btn" type="button" data-list="albums">Albums &amp; EPs</button>
    </div>

    <div class="rank-filter-toggle" id="rank-filter-toggle"></div>

    <div class="rank-mobile-tabs">
      <button class="tab-btn active" data-panel="tracks">Tracklist</button>
      <button class="tab-btn" data-panel="ranking">Your ranking</button>
    </div>

    <div class="rank-columns">
      <section class="rank-panel" id="rank-panel-tracks">
        <p class="rank-panel-title" id="rank-panel-tracks-title">Tracklist</p>
        <div class="track-search" id="track-search" style="display:none;">
          <div class="track-search-input-wrap">
            <input type="text" id="track-search-input" placeholder="Search songs or albums by this artist..." autocomplete="off" />
            <div class="track-search-suggestions" id="track-search-suggestions"></div>
          </div>
          <button id="track-search-btn">Search</button>
        </div>
        <div class="track-list" id="track-list"></div>
      </section>

      <section class="rank-panel mobile-hidden" id="rank-panel-ranking">
        <div class="rank-panel-title-row">
          <p class="rank-panel-title" id="rank-panel-ranking-title">Your ranking</p>
          <button id="clear-rank-btn" class="clear-rank-btn" type="button">Clear rankings</button>
        </div>
        <div class="rank-list" id="rank-list"></div>
      </section>
    </div>
    </div>
  </div>

  <footer class="site-footer">
    <nav class="footer-links" aria-label="Site">
      <a href="about.html">About</a>
      <a href="faq.html">Help &amp; FAQ</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </nav>
    <p class="footer-credit">Built with the Spotify Web API, ReccoBeats &amp; Last.fm &middot; &copy; 2026 TuneVis</p>
    <p class="footer-note">TuneVis isn't affiliated with or endorsed by Spotify.</p>
  </footer>

  <script type="module" src="scripts/rank.js"></script>
  <script type="module" src="scripts/account-nav.js"></script>
</body>
</html>
