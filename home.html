<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TuneVis</title>
  <link rel="stylesheet" href="styles/style.css">
  <script src="libs/d3.v7.min.js"></script>
  <script src="libs/popper.v2.min.js"></script>
  <script src="libs/tippy.v6.min.js"></script>
</head>
<body>
  <div class="bg-layer">
    <div class="bg-circle c1"></div>
    <div class="bg-circle c2"></div>
    <div class="bg-circle c3"></div>
    <div class="bg-circle c4"></div>
  </div>

  <header style="text-align:center; margin-top:20px;">
    <button id="info-btn" style="position:absolute; left:20px; top:20px;">About</button>
  </header>

  <!-- Search -->
  <div id="search-section">
    <input type="text" id="search-input" placeholder="Search for a song..." />
    <button id="search-btn">Search</button>
  </div>

  <div class="carousel-wrapper" id="search-carousel-wrapper" style="display:none;">
    <button id="scroll-left" class="scroll-btn">&lt;</button>
    <div id="search-results" class="carousel"></div>
    <button id="scroll-right" class="scroll-btn">&gt;</button>
  </div>

  <!-- Trending / Recent tabs -->
  <div class="home-tabs">
    <button class="tab-btn active" data-tab="trending">Trending</button>
    <button class="tab-btn" data-tab="recent">Recently Viewed</button>
  </div>

  <div id="tab-trending" class="tab-panel">
    <div id="trending-loading" class="tab-loading">Loading trending tracks…</div>
    <div class="carousel-wrapper" id="trending-carousel-wrapper" style="display:none;">
      <button id="trend-scroll-left" class="scroll-btn">&lt;</button>
      <div id="trending-results" class="carousel"></div>
      <button id="trend-scroll-right" class="scroll-btn">&gt;</button>
    </div>
  </div>

  <div id="tab-recent" class="tab-panel" style="display:none;">
    <div id="recent-empty" class="tab-empty" style="display:none;">
      <p>No recently viewed tracks yet.<br>Search for a song to get started.</p>
    </div>
    <div class="carousel-wrapper" id="recent-carousel-wrapper" style="display:none;">
      <button id="recent-scroll-left" class="scroll-btn">&lt;</button>
      <div id="recent-results" class="carousel"></div>
      <button id="recent-scroll-right" class="scroll-btn">&gt;</button>
    </div>
  </div>

  <footer>
    <p>TuneVis | Built using Spotify API, ReccoBeats &amp; Last.fm API</p>
  </footer>

  <script type="module" src="scripts/home.js"></script>
</body>
</html>
