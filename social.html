<body class="page-flex">
  <div class="bg-layer">
    <div class="bg-circle c1"></div>
    <div class="bg-circle c2"></div>
    <div class="bg-circle c3"></div>
    <div class="bg-circle c4"></div>
  </div>

  <header class="logo logo-compact">
    <svg class="logo-bars" viewBox="-10 -18 660 256" preserveAspectRatio="xMidYMid meet">
      <defs>
          <linearGradient id="tv-bars" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#139a45"/>
            <stop offset="1" stop-color="#3ff08a"/>
          </linearGradient>
        </defs>
        <g class="audio-bars">
        <rect x="40"  y="90"  width="18" height="40"  rx="9"/>
        <rect x="90"  y="60"  width="18" height="100" rx="9"/>
        <rect x="140" y="40"  width="18" height="140" rx="9"/>
        <rect x="190" y="80"  width="18" height="60"  rx="9"/>
        <rect x="240" y="10"  width="18" height="180" rx="9"/>
        <rect x="290" y="70"  width="18" height="80"  rx="9"/>
        <rect x="340" y="30"  width="18" height="160" rx="9"/>
        <rect x="390" y="85"  width="18" height="50"  rx="9"/>
        <rect x="440" y="60"  width="18" height="100" rx="9"/>
        <rect x="490" y="95"  width="18" height="30"  rx="9"/>
        <rect x="540" y="45"  width="18" height="130" rx="9"/>
        <rect x="590" y="80"  width="18" height="60"  rx="9"/>
      </g>
    </svg>

    <h1 class="logo-title">TuneVis</h1>

        Social
      </a>
    </nav>
  </header>

  <main class="social-page" id="social-page">
    <div class="social-gate" id="social-gate">
      <p class="tab-loading">Loading…</p>
    </div>

    <div id="social-app" hidden>
      <div class="social-me" id="social-me"></div>

      <div class="social-tabs" role="tablist" aria-label="Social">
        <button type="button" class="social-tab active" role="tab" id="tab-btn-feed" aria-controls="tab-feed" aria-selected="true" data-tab="feed">Feed</button>
        <button type="button" class="social-tab" role="tab" id="tab-btn-friends" aria-controls="tab-friends" aria-selected="false" data-tab="friends">Friends <span class="social-tab-badge" id="friends-badge" hidden></span></button>
        <button type="button" class="social-tab" role="tab" id="tab-btn-find" aria-controls="tab-find" aria-selected="false" data-tab="find">Add friends</button>
      </div>

      <section class="social-panel" id="tab-feed" role="tabpanel" aria-labelledby="tab-btn-feed">
        <div class="feed-list" id="feed-list"></div>
      </section>

      <section class="social-panel" id="tab-friends" role="tabpanel" aria-labelledby="tab-btn-friends" hidden>
        <div id="friends-requests"></div>
        <h2 class="social-heading">Your friends</h2>
        <div class="people-list" id="friends-list"></div>
        <div id="friends-sent"></div>
      </section>

      <section class="social-panel" id="tab-find" role="tabpanel" aria-labelledby="tab-btn-find" hidden>
        <label class="saved-search people-search">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M12.8 12.8l4.4 4.4"/></svg>
          <input type="search" id="people-search-input" placeholder="Search by username" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search people by username">
        </label>
        <p class="social-hint">Type at least two letters of a username.</p>
        <div class="people-list" id="people-results"></div>
      </section>
    </div>
  </main>
