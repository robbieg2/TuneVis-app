<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TuneVis</title>
  <meta name="theme-color" content="#121212">
  <meta name="description" content="Explore a song's audio features, find similar tracks and rank your favourite artists, albums and songs.">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="TuneVis">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/style.css">
</head>
<body class="page-flex">
  <div class="bg-layer">
    <div class="bg-circle c1"></div>
    <div class="bg-circle c2"></div>
    <div class="bg-circle c3"></div>
    <div class="bg-circle c4"></div>
  </div>

  <header class="logo">
    <svg class="logo-bars" viewBox="-10 -18 660 256" preserveAspectRatio="xMidYMid meet">
      <defs>
          <linearGradient id="tv-bars" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#139a45"/>
            <stop offset="1" stop-color="#3ff08a"/>
          </linearGradient>
        </defs>
        <g class="audio-bars">
        <rect x="40"  y="90"  width="18" height="40"  rx="9"/>
        <rect x="90"  y="60"  width="18" height="100" rx="9"/>
        <rect x="140" y="40"  width="18" height="140" rx="9"/>
        <rect x="190" y="80"  width="18" height="60"  rx="9"/>
        <rect x="240" y="10"  width="18" height="180" rx="9"/>
        <rect x="290" y="70"  width="18" height="80"  rx="9"/>
        <rect x="340" y="30"  width="18" height="160" rx="9"/>
        <rect x="390" y="85"  width="18" height="50"  rx="9"/>
        <rect x="440" y="60"  width="18" height="100" rx="9"/>
        <rect x="490" y="95"  width="18" height="30"  rx="9"/>
        <rect x="540" y="45"  width="18" height="130" rx="9"/>
        <rect x="590" y="80"  width="18" height="60"  rx="9"/>
      </g>
    </svg>

    <h1 class="logo-title">TuneVis</h1>
    <h3 class="logo-sub">Interactive Music Recommender</h3>
  </header>

  <div class="login">
    <a href="login.html"><button type="button">Log in</button></a>
    <nav class="landing-links" aria-label="Account options">
      <a href="forgot-password.html">Forgotten password</a>
      <a href="signup.html">Sign up</a>
      <a href="home.html">Continue without signing in</a>
    </nav>
  </div>

  <footer>
    <p>TuneVis | Built using Spotify API, ReccoBeats &amp; Last.fm API</p>
  </footer>
</body>
</html>
