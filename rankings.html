<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TuneVis — Rankings</title>
  <meta name="theme-color" content="#121212">
  <meta name="description" content="Explore a song's audio features, find similar tracks and rank your favourite artists, albums and songs.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="TuneVis">
  <meta property="og:title" content="TuneVis — Interactive Music Recommender">
  <meta property="og:description" content="Explore a song's audio features, find similar tracks and rank your favourite artists, albums and songs.">
  <meta property="og:image" content="https://tunevis.vercel.app/icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="TuneVis logo with audio bars">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://tunevis.vercel.app/icons/og-image.png">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="TuneVis">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/style.css">
</head>
<body class="page-flex">
  <div class="bg-layer">
    <div class="bg-circle c1"></div>
    <div class="bg-circle c2"></div>
    <div class="bg-circle c3"></div>
    <div class="bg-circle c4"></div>
  </div>

  <header class="features-header">
    <button id="back-btn" aria-label="Back">&#8592;</button>

    <a href="home.html" class="header-logo-link" title="TuneVis home">
      <div class="header-logo-inner">
        <svg class="header-logo-bars" viewBox="0 0 80 34" preserveAspectRatio="xMidYMid meet">
          <defs>
          <linearGradient id="tv-bars" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#139a45"/>
            <stop offset="1" stop-color="#3ff08a"/>
          </linearGradient>
        </defs>
        <g class="audio-bars">
            <rect x="4"  y="13" width="5" height="8"  rx="2.5"/>
            <rect x="15" y="5"  width="5" height="24" rx="2.5"/>
            <rect x="26" y="8"  width="5" height="18" rx="2.5"/>
            <rect x="37" y="2"  width="5" height="30" rx="2.5"/>
            <rect x="48" y="8"  width="5" height="18" rx="2.5"/>
            <rect x="59" y="5"  width="5" height="24" rx="2.5"/>
            <rect x="70" y="13" width="5" height="8"  rx="2.5"/>
          </g>
        </svg>
        <span class="header-logo-text">TuneVis</span>
      </div>
    </a>

  </header>

  <div class="rankings-intro">
    <h1 class="rankings-title">Rank your favourites</h1>
    <p class="rankings-sub">Search for an artist or album and build your own top tracks list</p>
  </div>

  <div id="rankings-search-section">
    <input type="text" id="rankings-search-input" placeholder="Search for an artist or album..." />
    <button id="rankings-search-btn">Search</button>
  </div>

  <div id="rankings-results" class="rankings-results-grid"></div>

  <div class="general-rank-cta">
    <p>No album or artist in mind?</p>
    <a href="rank-general.html"><button type="button">Create your own personal music rankings</button></a>
  </div>

  <section id="saved-rankings" class="saved-rankings" hidden>
    <div class="saved-rankings-head">
      <h2 class="saved-rankings-title">Your saved rankings</h2>
      <div class="sort-toggle" id="sort-toggle" role="group" aria-label="Sort saved rankings">
        <button type="button" data-sort="recent" aria-pressed="true">Most recent</button>
        <button type="button" data-sort="rating" aria-pressed="false">Highest stars</button>
      </div>
    </div>
    <div class="folder-bar" id="folder-bar" aria-label="Folders" hidden></div>
    <div class="folder-tools" id="folder-tools" hidden>
      <button type="button" class="folder-tool-btn" id="folder-rename">Rename folder</button>
      <button type="button" class="folder-tool-btn danger" id="folder-delete">Delete folder</button>
    </div>
    <div class="saved-rankings-list" id="saved-rankings-list"></div>
  </section>

  <footer>
    <p>TuneVis | Built using Spotify API, ReccoBeats &amp; Last.fm API</p>
  </footer>

  <script type="module" src="scripts/rankings.js"></script>
  <script type="module" src="scripts/rankings-library.js"></script>
  <script type="module" src="scripts/account-nav.js"></script>
</body>
</html>
