<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TuneVis — Rankings</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body class="page-flex">
  <div class="bg-layer">
    <div class="bg-circle c1"></div>
    <div class="bg-circle c2"></div>
    <div class="bg-circle c3"></div>
    <div class="bg-circle c4"></div>
  </div>

  <header class="features-header">
    <button id="back-btn">&#8592; Back</button>

    <a href="home.html" class="header-logo-link" title="TuneVis home">
      <div class="header-logo-inner">
        <svg class="header-logo-bars" viewBox="0 0 80 34" preserveAspectRatio="xMidYMid meet">
          <g class="audio-bars">
            <rect x="4"  y="13" width="5" height="8"  rx="2.5"/>
            <rect x="15" y="5"  width="5" height="24" rx="2.5"/>
            <rect x="26" y="8"  width="5" height="18" rx="2.5"/>
            <rect x="37" y="2"  width="5" height="30" rx="2.5"/>
            <rect x="48" y="8"  width="5" height="18" rx="2.5"/>
            <rect x="59" y="5"  width="5" height="24" rx="2.5"/>
            <rect x="70" y="13" width="5" height="8"  rx="2.5"/>
          </g>
        </svg>
        <span class="header-logo-text">TuneVis</span>
      </div>
    </a>

  </header>

  <div class="rankings-intro">
    <h1 class="rankings-title">Rank your favourites</h1>
    <p class="rankings-sub">Search for an artist or album and build your own top tracks list</p>
  </div>

  <div id="rankings-search-section">
    <input type="text" id="rankings-search-input" placeholder="Search for an artist or album..." />
    <button id="rankings-search-btn">Search</button>
  </div>

  <div id="rankings-results" class="rankings-results-grid"></div>

  <footer>
    <p>TuneVis | Built using Spotify API, ReccoBeats &amp; Last.fm API</p>
  </footer>

  <script type="module" src="scripts/rankings.js"></script>
</body>
</html>
